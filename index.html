<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Signals</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --line:#26304a; --txt:#e6eaf3; --mut:#8a94ad; --up:#2ecc8f; --dn:#ff5d6c; --acc:#4c8dff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--txt); }
  .wrap { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0; } h2 { font-size:15px; margin:22px 0 8px; color:var(--mut); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .login { max-width:360px; margin:12vh auto 0; }
  input { width:100%; padding:11px; margin:6px 0; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--txt); font-size:16px; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--acc); color:#fff; font-size:15px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; }
  .stat b { display:block; font-size:22px; } .stat span { color:var(--mut); font-size:12px; }
  .scroll { overflow-x:auto; } table { width:100%; border-collapse:collapse; font-size:14px; white-space:nowrap; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); } th { color:var(--mut); font-weight:500; }
  .up { color:var(--up); } .dn { color:var(--dn); } .mut { color:var(--mut); }
  .tag { padding:2px 8px; border-radius:99px; font-size:12px; background:var(--line); }
  .msg { color:var(--dn); min-height:20px; font-size:14px; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- login -->
  <div id="loginView" class="card login hide">
    <h1>Trade Signals</h1>
    <p class="mut">Log in to see live signals and trades.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <div class="msg" id="loginMsg"></div>
    <div class="row"><button id="btnIn">Log in</button><button id="btnUp" class="ghost">Sign up</button></div>
  </div>

  <!-- waiting for approval -->
  <div id="pendingView" class="card login hide">
    <h1>Almost there</h1>
    <p class="mut">Your account is waiting for approval. You will get access as soon as it is approved.</p>
    <button id="btnOut1" class="ghost">Log out</button>
  </div>

  <!-- dashboard -->
  <div id="appView" class="hide">
    <div class="top">
      <h1>Trade Signals</h1>
      <div class="row" style="flex:none"><button id="btnNotif" class="ghost">Enable alerts</button><button id="btnOut2" class="ghost">Log out</button></div>
    </div>

    <h2>Performance (closed trades)</h2>
    <div class="stats" id="stats"></div>

    <h2>Live signals</h2>
    <div class="card scroll"><table id="sigTbl"></table></div>

    <h2>Open trades</h2>
    <div class="card scroll"><table id="openTbl"></table></div>

    <h2>Trade history</h2>
    <div class="card scroll"><table id="histTbl"></table></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Your project details (the publishable key is safe to be public). Never put the secret key here.
const SUPABASE_URL = "https://hgycxhfkazvyudajjjgh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mOSbg4WwCT3C_PuoA4S73g_etw749-v";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let channel = null, trades = [], signals = [], ready = false;

const fmt = (n, d = 2) => (n === null || n === undefined || Number(n) === 0) ? "–" : Number(n).toFixed(d);
const money = n => (n >= 0 ? "+" : "") + Number(n).toFixed(2);
const when = t => t ? new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "–";
const cls = n => n > 0 ? "up" : n < 0 ? "dn" : "";
function show(view) { for (const v of ["loginView", "pendingView", "appView"]) $(v).classList.toggle("hide", v !== view); }
function table(el, head, rows) {
  el.innerHTML = "";
  const tr = el.insertRow();
  head.forEach(h => { const th = document.createElement("th"); th.textContent = h; tr.appendChild(th); });
  if (!rows.length) { const r = el.insertRow(); const c = r.insertCell(); c.colSpan = head.length; c.className = "mut"; c.textContent = "Nothing yet"; return; }
  rows.forEach(cells => {
    const r = el.insertRow();
    cells.forEach(([text, c]) => { const td = r.insertCell(); td.textContent = text; if (c) td.className = c; });
  });
}

// ── auth ──
$("btnIn").onclick = async () => {
  $("loginMsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  if (error) $("loginMsg").textContent = error.message;
};
$("btnUp").onclick = async () => {
  $("loginMsg").textContent = "";
  const { error } = await sb.auth.signUp({ email: $("email").value.trim(), password: $("pass").value });
  $("loginMsg").textContent = error ? error.message : "Account created. Check your email if confirmation is on, then log in.";
};
const logout = () => sb.auth.signOut();
$("btnOut1").onclick = logout; $("btnOut2").onclick = logout;

$("btnNotif").onclick = async () => {
  if (!("Notification" in window)) return alert("Notifications are not supported on this browser.");
  const p = await Notification.requestPermission();
  $("btnNotif").textContent = p === "granted" ? "Alerts on" : "Alerts blocked";
};

sb.auth.onAuthStateChange((_e, session) => { start(session); });
sb.auth.getSession().then(({ data }) => start(data.session));

async function start(session) {
  if (channel) { sb.removeChannel(channel); channel = null; }
  ready = false;
  if (!session) return show("loginView");
  const { data: prof } = await sb.from("profiles").select("approved").eq("id", session.user.id).maybeSingle();
  if (!prof || !prof.approved) return show("pendingView");
  show("appView");
  await loadAll();
  ready = true;
  channel = sb.channel("live")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "signals" }, p => {
      signals.unshift(p.new); signals = signals.slice(0, 30); renderSignals(); notify(p.new);
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "trades" }, () => loadTrades())
    .subscribe();
}

// ── data ──
async function loadAll() { await Promise.all([loadSignals(), loadTrades()]); }
async function loadSignals() {
  const { data } = await sb.from("signals").select("*").order("created_at", { ascending: false }).limit(30);
  signals = data || []; renderSignals();
}
async function loadTrades() {
  const { data } = await sb.from("trades").select("*").order("open_time", { ascending: false }).limit(300);
  trades = data || []; renderTrades();
}

function notify(s) {
  if (!ready || !("Notification" in window) || Notification.permission !== "granted") return;
  new Notification(`${s.side.toUpperCase()} ${s.symbol}`, { body: `${s.order_type} @ ${s.entry}  SL ${s.sl}  TP ${s.tp}` });
}

// ── render ──
function renderSignals() {
  table($("sigTbl"), ["Time", "Symbol", "Side", "Type", "Entry", "SL", "TP"],
    signals.map(s => [[when(s.created_at)], [s.symbol], [s.side.toUpperCase(), s.side === "buy" ? "up" : "dn"],
      [s.order_type], [fmt(s.entry, 5)], [fmt(s.sl, 5)], [fmt(s.tp, 5)]]));
}
function renderTrades() {
  const open = trades.filter(t => t.status === "open");
  const closed = trades.filter(t => t.status === "closed");

  table($("openTbl"), ["Opened", "Symbol", "Side", "Lots", "Entry", "SL", "TP", "Banked P/L"],
    open.map(t => [[when(t.open_time)], [t.symbol], [t.side.toUpperCase(), t.side === "buy" ? "up" : "dn"], [fmt(t.volume)],
      [fmt(t.open_price, 5)], [fmt(t.sl, 5)], [fmt(t.tp, 5)], [money(t.profit || 0), cls(t.profit)]]));

  table($("histTbl"), ["Closed", "Symbol", "Side", "Lots", "Entry", "Exit", "P/L"],
    closed.map(t => [[when(t.close_time)], [t.symbol], [t.side.toUpperCase(), t.side === "buy" ? "up" : "dn"], [fmt(t.volume)],
      [fmt(t.open_price, 5)], [fmt(t.close_price, 5)], [money(t.profit || 0), cls(t.profit)]]));

  const wins = closed.filter(t => t.profit > 0), losses = closed.filter(t => t.profit <= 0);
  const net = closed.reduce((a, t) => a + Number(t.profit || 0), 0);
  const gw = wins.reduce((a, t) => a + Number(t.profit), 0), gl = Math.abs(losses.reduce((a, t) => a + Number(t.profit), 0));
  const items = [
    ["Trades", closed.length, ""],
    ["Win rate", closed.length ? Math.round(wins.length / closed.length * 100) + "%" : "–", ""],
    ["Net P/L", money(net), cls(net)],
    ["Profit factor", gl > 0 ? (gw / gl).toFixed(2) : (gw > 0 ? "∞" : "–"), ""],
    ["Open now", open.length, ""],
  ];
  $("stats").innerHTML = "";
  items.forEach(([label, val, c]) => {
    const d = document.createElement("div"); d.className = "card stat";
    const b = document.createElement("b"); b.textContent = val; if (c) b.className = c;
    const s = document.createElement("span"); s.textContent = label;
    d.append(b, s); $("stats").appendChild(d);
  });
}
</script>
</body>
</html>
